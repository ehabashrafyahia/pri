<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>الدرس | المنصة التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    
    <style>
        :root {
            --bg-deep: #06060f;
            --accent-1: #8b5cf6;
            --accent-2: #6366f1;
            --accent-3: #10b981;
            --accent-4: #f59e0b;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        html { height: 100%; margin: 0; padding: 0; background: var(--bg-deep); }

        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100%;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            background: radial-gradient(ellipse at 30% 20%, #1a1535 0%, #0c0a1a 45%, #050510 100%);
            position: relative;
        }

        .bg-grid {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
            opacity: 0.03;
            background-image:
                linear-gradient(rgba(255,255,255,0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.3) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(ellipse at center, black 25%, transparent 70%);
        }

        .light-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.2;
            animation: orbDrift 16s ease-in-out infinite;
        }
        .orb-1 { width: 350px; height: 350px; background: #7c3aed; top: -8%; left: -6%; }
        @keyframes orbDrift {
            0%,100%{transform:translate(0,0) scale(1)}
            50%{transform:translate(30px,-20px) scale(1.1)}
        }

        .main-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 20px;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            color: #cbd5e1;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            animation: fadeInDown 0.8s ease;
        }
        .header h1 {
            color: #fff;
            font-size: 1.3rem;
            font-weight: 800;
            margin: 0;
        }
        .header .lesson-badge {
            display: inline-block;
            background: rgba(139,92,246,0.2);
            border: 1px solid rgba(139,92,246,0.4);
            border-radius: 20px;
            padding: 5px 18px;
            color: #c4b5fd;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .options-container {
            display: flex;
            gap: 20px;
            max-width: 550px;
            width: 100%;
            flex-wrap: wrap;
            justify-content: center;
        }

        .option-card {
            flex: 1;
            min-width: 200px;
            max-width: 260px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 24px;
            padding: 35px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.4s;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
        }
        .option-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255,255,255,0.25);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .option-card:active {
            transform: scale(0.95);
        }
        .option-icon {
            width: 70px;
            height: 70px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            font-size: 1.8rem;
            color: #fff;
        }
        .option-card:nth-child(1) .option-icon {
            background: linear-gradient(135deg, #8b5cf6, #6366f1);
            box-shadow: 0 10px 30px rgba(139,92,246,0.4);
        }
        .option-card:nth-child(2) .option-icon {
            background: linear-gradient(135deg, #10b981, #059669);
            box-shadow: 0 10px 30px rgba(16,185,129,0.4);
        }
        .option-title {
            color: #fff;
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }
        .option-desc {
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 600;
        }

        @keyframes fadeInDown {
            from{opacity:0;transform:translateY(-20px)}
            to{opacity:1;transform:translateY(0)}
        }

        @media (max-width: 500px) {
            .options-container {
                flex-direction: column;
                align-items: center;
            }
            .option-card {
                max-width: 100%;
                min-width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="light-orb orb-1"></div>
    <div class="bg-grid"></div>

    <button class="back-btn" onclick="goBack()" title="العودة">
        <i class="fas fa-arrow-right"></i>
    </button>

    <div class="main-container">
        <div class="header">
            <h1 id="lesson-title">الدرس</h1>
            <div class="lesson-badge" id="lesson-badge">📚 محتوى الدرس</div>
        </div>

        <div class="options-container" id="options-container">
            <div class="option-card" onclick="openSummary()">
                <div class="option-icon"><i class="fas fa-file-alt"></i></div>
                <div class="option-title">ملخص الدرس</div>
                <div class="option-desc">صورة أو فيديو تعليمي</div>
            </div>
            <div class="option-card" onclick="openQuiz()">
                <div class="option-icon"><i class="fas fa-question-circle"></i></div>
                <div class="option-title">كويز إلكتروني</div>
                <div class="option-desc">اختبر معلوماتك</div>
            </div>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem("atlas_auth") !== "true") {
            window.location.href = "index.html";
        }

        // استرجاع بيانات الدرس
        const lessonData = JSON.parse(sessionStorage.getItem("currentLesson") || "{}");
        document.getElementById('lesson-title').textContent = lessonData.lessonName || "الدرس";
        document.getElementById('lesson-badge').textContent = "📚 " + (lessonData.lessonName || "محتوى الدرس");

        // أنيميشن الظهور
        window.addEventListener('load', function() {
            anime({
                targets: '.option-card',
                opacity: [0, 1],
                translateY: [30, 0],
                easing: 'easeOutCubic',
                duration: 600,
                delay: anime.stagger(200, {start: 300}),
            });
        });

        function openSummary() {
            const card = event.currentTarget;
            anime({
                targets: card,
                scale: [1, 0.93, 1.04, 1],
                easing: 'easeInOutQuad',
                duration: 400,
                complete: function() {
                    // يمكن تعديل المسار لاحقاً
                    Swal.fire({
                        icon: 'info',
                        title: 'ملخص الدرس',
                        text: 'سيتم إضافة صورة أو فيديو ملخص الدرس هنا',
                        confirmButtonText: 'حسناً',
                    });
                }
            });
        }

        function openQuiz() {
            const card = event.currentTarget;
            anime({
                targets: card,
                scale: [1, 0.93, 1.04, 1],
                easing: 'easeInOutQuad',
                duration: 400,
                complete: function() {
                    sessionStorage.setItem("quizLesson", JSON.stringify(lessonData));
                    window.location.href = "quiz.html";
                }
            });
        }

        function goBack() {
            window.location.href = "grade.html";
        }
    </script>
</body>
</html>
