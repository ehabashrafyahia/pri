<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة أطلس التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center px-4">

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-amber-600/20 border border-amber-500/30 text-amber-500 rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold mb-3">🔒</div>
            <h1 class="text-2xl font-black text-white">تسجيل الدخول الآمن</h1>
            <p class="text-slate-400 text-xs mt-1">المنصة مخصصة للحسابات الرسمية فقط</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">اسم المستخدم أو المعرف السري</label>
                <input type="password" id="login-name" required placeholder="أدخل المعرف الخاص بك..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-amber-500 outline-none transition-all font-mono">
            </div>

            <div id="error-msg" class="hidden bg-rose-950/40 border border-rose-900/50 text-rose-300 p-3 rounded-xl text-xs text-center font-bold">
                ⚠️ اسم المستخدم غير صحيح! يجدر استخدام المعرف المصرح به فقط.
            </div>

            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 font-bold py-3 rounded-xl transition-all shadow-lg shadow-amber-600/20 text-sm mt-2">
                تحقق ودخول المنصة 🚀
            </button>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const inputName = document.getElementById('login-name').value.trim();
            const errorDiv = document.getElementById('error-msg');

            // حساب المعلم الخاص بك
            if (inputName === 'OlO') {
                localStorage.setItem('userRole', 'admin');
                localStorage.setItem('userName', 'OlO (المعلم)');
                window.location.href = 'admin.html';
                return;
            }

            // خريطة لربط يوزرات الطلاب بالصف الدراسي حصراً
            const studentAccounts = {
                'student4': { name: 'طالب الصف الرابع', grade: 'p4' },
                'student5': { name: 'طالب الصف الخامس', grade: 'p5' },
                'student6': { name: 'طالب الصف السادس', grade: 'p6' },
                'prep1': { name: 'طالب الأول الإعدادي', grade: 'prep1' },
                'prep2': { name: 'طالب الثاني الإعدادي', grade: 'prep2' },
                'prep3': { name: 'طالب الثالث الإعدادي', grade: 'prep3' }
            };

            const account = studentAccounts[inputName];

            if (account) {
                errorDiv.classList.add('hidden');
                localStorage.setItem('userRole', 'student');
                localStorage.setItem('userName', account.name);
                localStorage.setItem('studentName', account.name);
                localStorage.setItem('studentGrade', account.grade);
                window.location.href = 'dashboard.html';
            } else {
                // منع أي يوزر آخر تماماً وإظهار تنبيه الخطأ
                errorDiv.classList.remove('hidden');
                document.getElementById('login-name').value = '';
            }
        }
    </script>
</body>
</html>
