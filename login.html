<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة أطلس التعليمية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style> 
        body { font-family: 'Tajawal', sans-serif; } 
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        .animate-float { animation: floatLogo 3s ease-in-out infinite; }
        .animate-glow { animation: pulseGlow 3s ease-in-out infinite; }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center overflow-x-hidden relative p-4">

    <!-- خلفية مضيئة متجاوبة -->
    <div class="absolute w-72 h-72 sm:w-96 sm:h-96 bg-amber-600/10 rounded-full blur-3xl animate-glow -top-10 -right-10 pointer-events-none"></div>
    <div class="absolute w-72 h-72 sm:w-96 sm:h-96 bg-amber-500/10 rounded-full blur-3xl animate-glow -bottom-10 -left-10 pointer-events-none" style="animation-delay: 1.5s;"></div>

    <!-- شاشة الـ Splash (تظهر أولاً وتملأ الشريط باسم المنصة) -->
    <div id="splash-screen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center transition-all duration-700 px-4 text-center">
        <div class="relative mb-6">
            <div class="absolute inset-0 bg-amber-500/20 rounded-3xl blur-xl animate-glow"></div>
            <div class="relative w-20 h-20 sm:w-24 sm:h-24 bg-gradient-to-br from-amber-500 to-amber-700 rounded-3xl flex items-center justify-center text-4xl sm:text-5xl shadow-2xl border border-amber-400/30 animate-float">
                🌍
            </div>
        </div>

        <h1 class="text-2xl sm:text-4xl font-black tracking-wide mb-2">
            منصة <span class="text-amber-500">أطلس</span> التعليمية
        </h1>
        <p class="text-slate-400 text-xs sm:text-sm tracking-wider uppercase mb-8">
            بوابتك الذكية لدراسات اجتماعية ممتعة
        </p>

        <!-- شريط التحميل -->
        <div class="w-44 sm:w-52 h-1.5 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
            <div id="progress-bar" class="h-full bg-amber-500 w-0 transition-all duration-1500 rounded-full"></div>
        </div>
    </div>

    <!-- حاوية React لتسجيل الدخول -->
    <div id="root" class="w-full flex items-center justify-center z-10"></div>

    <script>
        // التحقق مما إذا شاهد المستخدم شاشة الترحيب مسبقاً في هذه الجلسة
        window.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            const splashScreen = document.getElementById('splash-screen');

            // إذا كان قد شاهدها، نقوم بإزالتها فوراً لكي لا تتكرر عند الضغط أو التنقل
            if (sessionStorage.getItem('splashShown')) {
                splashScreen.remove();
                return;
            }

            // تشغيل شريط التحميل لأول مرة فقط
            setTimeout(() => {
                progressBar.style.width = '100%';
            }, 100);

            // بعد انتهاء المدة، يتم إخفاء الـ Splash وحفظ الحالة في المتصفح المؤقت
            setTimeout(() => {
                splashScreen.style.opacity = '0';
                splashScreen.style.pointerEvents = 'none';
                
                setTimeout(() => {
                    splashScreen.remove();
                    sessionStorage.setItem('splashShown', 'true');
                }, 700);
            }, 2000);
        });
    </script>

    <!-- كود React لصفحة تسجيل الدخول -->
    <script type="text/babel">
        function Login() {
            const [inputName, setInputName] = React.useState('');
            const [errorMsg, setErrorMsg] = React.useState(false);
            const [isLoading, setIsLoading] = React.useState(false);

            const handleLogin = (e) => {
                e.preventDefault();
                const trimmedName = inputName.trim();
                setIsLoading(true);

                setTimeout(() => {
                    // حساب المعلم الخاص بك
                    if (trimmedName === 'OlO') {
                        localStorage.setItem('userRole', 'admin');
                        localStorage.setItem('userName', 'OlO (المعلم)');
                        window.location.href = 'admin.html';
                        return;
                    }

                    // خريطة لربط يوزرات الطلاب بالصف الدراسي حصراً
                    const studentAccounts = {
                        'student4': { name: 'طالب الصف الرابع', grade: 'p4' },
                        'student5': { name: 'طالب الصف الخامس', grade: 'p5' },
                        'student6': { name: 'طالب الصف السادس', grade: 'p6' },
                        'prep1': { name: 'طالب الأول الإعدادي', grade: 'prep1' },
                        'prep2': { name: 'طالب الثاني الإعدادي', grade: 'prep2' },
                        'prep3': { name: 'طالب الثالث الإعدادي', grade: 'prep3' }
                    };

                    const account = studentAccounts[trimmedName];

                    if (account) {
                        setErrorMsg(false);
                        localStorage.setItem('userRole', 'student');
                        localStorage.setItem('userName', account.name);
                        localStorage.setItem('studentName', account.name);
                        localStorage.setItem('studentGrade', account.grade);
                        window.location.href = 'dashboard.html';
                    } else {
                        // منع أي يوزر آخر تماماً وإظهار تنبيه الخطأ
                        setErrorMsg(true);
                        setInputName('');
                        setIsLoading(false);
                    }
                }, 400);
            };

            return (
                <div className="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-6 sm:p-8 max-w-sm sm:max-w-md w-full shadow-2xl relative overflow-hidden">
                    
                    {/* تأثير توهج خلفي خفيف */}
                    <div className="absolute -top-24 -right-24 w-48 h-48 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

                    <div className="text-center mb-6 sm:mb-8 relative z-10">
                        <div className="w-14 h-14 bg-gradient-to-br from-amber-600/20 to-amber-500/10 border border-amber-500/30 text-amber-500 rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold mb-3 shadow-inner">
                            🔒
                        </div>
                        <h1 className="text-xl sm:text-2xl font-black text-white tracking-wide">تسجيل الدخول الآمن</h1>
                        <p className="text-slate-400 text-xs mt-1">المنصة مخصصة للحسابات الرسمية فقط</p>
                    </div>

                    <form onSubmit={handleLogin} className="space-y-4 relative z-10">
                        <div>
                            <label className="block text-xs font-bold text-slate-300 mb-1.5">اسم المستخدم أو المعرف السري</label>
                            <input 
                                type="password" 
                                value={inputName}
                                onChange={(e) => setInputName(e.target.value)}
                                required 
                                placeholder="أدخل المعرف الخاص بك..." 
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 outline-none transition-all font-mono"
                            />
                        </div>

                        {errorMsg && (
                            <div className="bg-rose-950/40 border border-rose-900/50 text-rose-300 p-3 rounded-xl text-xs text-center font-bold animate-pulse">
                                ⚠️ اسم المستخدم غير صحيح! يجدر استخدام المعرف المصرح به فقط.
                            </div>
                        )}

                        <button 
                            type="submit" 
                            disabled={isLoading}
                            className="w-full bg-amber-600 hover:bg-amber-700 active:scale-95 font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-amber-600/20 text-sm mt-2 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50">
                            {isLoading ? 'جاري التحقق...' : 'تحقق ودخول المنصة 🚀'}
                        </button>
                    </form>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Login />);
    </script>
</body>
</html>
