<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة أطلس التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center px-4">

    <div class="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-amber-600/20 border border-amber-500/30 text-amber-500 rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold mb-3">🎓</div>
            <h1 class="text-2xl font-black text-white">تسجيل الدخول للمنصة</h1>
            <p class="text-slate-400 text-xs mt-1">أدخل بياناتك للبدء في تصفح الدروس</p>
        </div>

        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">اسم الطالب أو المعلم</label>
                <input type="text" id="login-name" required placeholder="اكتب اسمك هنا..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-amber-500 outline-none transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 mb-1">الصف الدراسي</label>
                <select id="login-grade" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-slate-200 focus:border-amber-500 outline-none transition-all">
                    <option value="p4">الصف الرابع الابتدائي</option>
                    <option value="p5">الصف الخامس الابتدائي</option>
                    <option value="prep1">الصف الأول الإعدادي</option>
                </select>
            </div>

            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 font-bold py-3 rounded-xl transition-all shadow-lg shadow-amber-600/20 text-sm mt-2">
                دخول المنصة 🚀
            </button>
        </form>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('login-name').value.trim();
            const grade = document.getElementById('login-grade').value;

            // إذا كان الاسم خاص بالأستاذ إيهاب، ندخله للوحة التحكم مباشرة
            if (name.includes('إيهاب') || name.includes('ابهاب') || name === 'admin') {
                localStorage.setItem('userRole', 'admin');
                localStorage.setItem('userName', name);
                window.location.href = 'admin.html';
            } else {
                localStorage.setItem('userRole', 'student');
                localStorage.setItem('userName', name);
                localStorage.setItem('studentName', name);
                localStorage.setItem('studentGrade', grade);
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
