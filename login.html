<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة أطلس التعليمية</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Tajawal', sans-serif; } 
        
        /* تأثيرات الانيميشن المخصصة للشاشة الترحيبية */
        @keyframes floatLogo {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.05); }
        }
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.15); }
        }
        .animate-float {
            animation: floatLogo 3s ease-in-out infinite;
        }
        .animate-glow {
            animation: pulseGlow 3s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center overflow-hidden relative">

    <!-- خلفية جمالية متحركة (Glow Effects) -->
    <div class="absolute w-96 h-96 bg-amber-600/10 rounded-full blur-3xl animate-glow -top-20 -right-20 pointer-events-none"></div>
    <div class="absolute w-96 h-96 bg-amber-500/10 rounded-full blur-3xl animate-glow -bottom-20 -left-20 pointer-events-none" style="animation-delay: 1.5s;"></div>

    <!-- حاوية شاشة الـ Splash الاحترافية -->
    <div id="splash-screen" class="absolute inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center transition-all duration-700 px-6">
        <div class="relative mb-6">
            <!-- هالة مضيئة خلف الشعار -->
            <div class="absolute inset-0 bg-amber-500/20 rounded-3xl blur-xl animate-glow"></div>
            <!-- أيقونة الشعار -->
            <div class="relative w-24 h-24 bg-gradient-to-br from-amber-500 to-amber-700 rounded-3xl flex items-center justify-center text-5xl shadow-2xl border border-amber-400/30 animate-float">
                🌍
            </div>
        </div>

        <h1 class="text-3xl md:text-4xl font-black tracking-wide mb-2 text-center">
            منصة <span class="text-amber-500">أطلس</span> التعليمية
        </h1>
        <p class="text-slate-400 text-xs md:text-sm tracking-widest uppercase mb-8 text-center">
            بوابتك الذكية لدراسات اجتماعية ممتعة
        </p>

        <!-- شريط التحميل التفاعلي (Progress Bar) -->
        <div class="w-48 h-1.5 bg-slate-900 rounded-full overflow-hidden border border-slate-800">
            <div id="progress-bar" class="h-full bg-amber-500 w-0 transition-all duration-1000 rounded-full"></div>
        </div>
    </div>

    <!-- المحتوى الأساسي للصفحة الرئيسية (يظهر بعد انتهاء الـ Splash) -->
    <main class="container mx-auto px-6 py-16 max-w-4xl text-center flex flex-col justify-center items-center opacity-0 transition-opacity duration-1000" id="main-content">
        <div class="w-20 h-20 bg-amber-500/10 border border-amber-500/20 rounded-3xl flex items-center justify-center text-4xl mb-6 shadow-lg shadow-amber-500/5">📚</div>
        <h2 class="text-3xl md:text-5xl font-black mb-4 leading-tight">
            مرحباً بك في منصة <span class="text-amber-500">أطلس</span>
        </h2>
        <p class="text-slate-400 text-base max-w-xl mx-auto mb-8 leading-relaxed">
            المنصة التعليمية التفاعلية للمرحلتين الابتدائية والإعدادية لمتابعة الدروس وحل الاختبارات الذاتية.
        </p>
        <div class="flex gap-4">
            <a href="login.html" class="bg-amber-600 hover:bg-amber-700 font-bold px-8 py-3.5 rounded-2xl transition-all shadow-xl shadow-amber-600/20 text-sm flex items-center gap-2">
                تسجيل الدخول للمنصة 🚀
            </a>
        </div>
    </main>

    <script>
        // محاكاة عملية التحميل التلقائي لشاشة الـ Splash
        window.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('progress-bar');
            const splashScreen = document.getElementById('splash-screen');
            const mainContent = document.getElementById('main-content');

            // تحريك شريط التحميل بعد قليل من الفتح
            setTimeout(() => {
                progressBar.style.width = '100%';
            }, 200);

            // إخفاء الـ Splash وعرض المحتوى بعد 2.2 ثانية بسلاسة
            setTimeout(() => {
                splashScreen.style.opacity = '0';
                splashScreen.style.pointerEvents = 'none';
                
                mainContent.style.opacity = '1';

                // إزالة عنصر الـ Splash تماماً من الصفحة بعد انتهاء التلاشي
                setTimeout(() => {
                    splashScreen.remove();
                }, 700);
            }, 2000);
        });
    </script>
</body>
</html>
