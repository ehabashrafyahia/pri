<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - منصة أطلس التعليمية</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style> body { font-family: 'Tajawal', sans-serif; } </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- خلفية مضيئة خفيفة -->
    <div class="absolute w-80 h-80 bg-amber-600/10 rounded-full blur-3xl -top-10 -right-10 pointer-events-none"></div>

    <!-- حاوية React -->
    <div id="root" class="w-full flex items-center justify-center z-10"></div>

    <script type="text/babel">
        function Login() {
            const [inputName, setInputName] = React.useState('');
            const [errorMsg, setErrorMsg] = React.useState(false);
            const [isLoading, setIsLoading] = React.useState(false);

            const handleLogin = (e) => {
                e.preventDefault();
                const trimmedName = inputName.trim();
                setIsLoading(true);

                setTimeout(() => {
                    // حساب المعلم الخاص بك
                    if (trimmedName === 'OlO') {
                        localStorage.setItem('userRole', 'admin');
                        localStorage.setItem('userName', 'OlO (المعلم)');
                        window.location.href = 'admin.html';
                        return;
                    }

                    // خريطة لربط يوزرات الطلاب بالصف الدراسي حصراً
                    const studentAccounts = {
                        'student4': { name: 'طالب الصف الرابع', grade: 'p4' },
                        'student5': { name: 'طالب الصف الخامس', grade: 'p5' },
                        'student6': { name: 'طالب الصف السادس', grade: 'p6' },
                        'prep1': { name: 'طالب الأول الإعدادي', grade: 'prep1' },
                        'prep2': { name: 'طالب الثاني الإعدادي', grade: 'prep2' },
                        'prep3': { name: 'طالب الثالث الإعدادي', grade: 'prep3' }
                    };

                    const account = studentAccounts[trimmedName];

                    if (account) {
                        setErrorMsg(false);
                        localStorage.setItem('userRole', 'student');
                        localStorage.setItem('userName', account.name);
                        localStorage.setItem('studentName', account.name);
                        localStorage.setItem('studentGrade', account.grade);
                        window.location.href = 'dashboard.html';
                    } else {
                        // منع أي يوزر آخر تماماً وإظهار تنبيه الخطأ
                        setErrorMsg(true);
                        setInputName('');
                        setIsLoading(false);
                    }
                }, 400);
            };

            return (
                <div className="bg-slate-900/90 backdrop-blur-xl border border-slate-800/80 rounded-3xl p-6 sm:p-8 max-w-sm sm:max-w-md w-full shadow-2xl relative overflow-hidden">
                    
                    <div className="text-center mb-6 sm:mb-8 relative z-10">
                        <div className="w-14 h-14 bg-gradient-to-br from-amber-600/20 to-amber-500/10 border border-amber-500/30 text-amber-500 rounded-2xl mx-auto flex items-center justify-center text-2xl font-bold mb-3 shadow-inner">
                            🔒
                        </div>
                        <h1 className="text-xl sm:text-2xl font-black text-white tracking-wide">تسجيل الدخول الآمن</h1>
                        <p className="text-slate-400 text-xs mt-1">المنصة مخصصة للحسابات الرسمية فقط</p>
                    </div>

                    <form onSubmit={handleLogin} className="space-y-4 relative z-10">
                        <div>
                            <label className="block text-xs font-bold text-slate-300 mb-1.5">اسم المستخدم أو المعرف السري</label>
                            <input 
                                type="password" 
                                value={inputName}
                                onChange={(e) => setInputName(e.target.value)}
                                required 
                                placeholder="أدخل المعرف الخاص بك..." 
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 focus:border-amber-500 focus:ring-2 focus:ring-amber-500/20 outline-none transition-all font-mono"
                            />
                        </div>

                        {errorMsg && (
                            <div className="bg-rose-950/40 border border-rose-900/50 text-rose-300 p-3 rounded-xl text-xs text-center font-bold animate-pulse">
                                ⚠️ اسم المستخدم غير صحيح! يجدر استخدام المعرف المصرح به فقط.
                            </div>
                        )}

                        <button 
                            type="submit" 
                            disabled={isLoading}
                            className="w-full bg-amber-600 hover:bg-amber-700 active:scale-95 font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-amber-600/20 text-sm mt-2 flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50">
                            {isLoading ? 'جاري التحقق...' : 'تحقق ودخول المنصة 🚀'}
                        </button>
                    </form>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<Login />);
    </script>
</body>
</html>
