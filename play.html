<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>كويز أرينا — العب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg-deep:#15152E; --bg-panel:#1F1F42;
    --amber:#FFB627; --coral:#FF6B6B; --teal:#4ECDC4; --lime:#A8E10C;
    --ink:#F7F7F2;
  }
  html,body{ font-family:'Cairo', sans-serif; background:var(--bg-deep); color:var(--ink); }
  .glow{ position:fixed; inset:0; z-index:0; pointer-events:none;
    background: radial-gradient(600px 400px at 15% 10%, rgba(255,182,39,.10), transparent 60%),
                radial-gradient(500px 400px at 85% 90%, rgba(78,205,196,.10), transparent 60%); }
  .screen{ display:none; }
  .screen.active{ display:flex; }
  .choice-btn{ transition: transform .1s, opacity .2s; }
  .choice-btn:active{ transform: scale(.96); }
  .choice-btn.dimmed{ opacity:.3; }
  .choice-btn.selected{ outline: 4px solid white; }
  .bounce{ animation: bounce 1.4s ease-in-out infinite; }
  @keyframes bounce{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }
</style>
</head>
<body class="min-h-screen relative overflow-x-hidden">
<div class="glow"></div>

<!-- ============ استنى بدء اللعبة ============ -->
<section id="screen-waiting" class="screen active relative z-10 min-h-screen flex-col items-center justify-center px-6 text-center">
  <div class="text-6xl mb-6 bounce">⏳</div>
  <h1 class="text-2xl font-black mb-2">أهلًا <span id="waitingName" style="color:var(--amber)"></span></h1>
  <p class="text-white/50">استنى المعلم يبدأ اللعبة...</p>
</section>

<!-- ============ السؤال ============ -->
<section id="screen-question" class="screen relative z-10 min-h-screen flex-col px-4 py-6">
  <div class="flex items-center justify-between mb-4">
    <span id="qCounter" class="text-white/50 font-bold text-sm">سؤال 1</span>
    <div id="timer" class="text-xl font-black rounded-full w-11 h-11 flex items-center justify-center" style="background:var(--bg-panel);">20</div>
  </div>
  <h2 id="questionText" class="text-xl font-black text-center mb-6 leading-snug">نص السؤال</h2>
  <div class="grid grid-cols-2 gap-3 flex-1" id="choicesGrid"></div>
</section>

<!-- ============ بعد الإرسال - استنى النتيجة ============ -->
<section id="screen-submitted" class="screen relative z-10 min-h-screen flex-col items-center justify-center px-6 text-center">
  <div class="text-6xl mb-6 bounce">📨</div>
  <p class="text-xl font-bold">تم إرسال إجابتك</p>
  <p class="text-white/50 mt-2">في انتظار باقي الطلاب...</p>
</section>

<!-- ============ كشف النتيجة ============ -->
<section id="screen-reveal" class="screen relative z-10 min-h-screen flex-col items-center justify-center px-6 text-center">
  <div id="resultIcon" class="text-7xl mb-4"></div>
  <p id="resultText" class="text-2xl font-black mb-2"></p>
  <p id="pointsEarned" class="text-lg mb-6" style="color:var(--amber)"></p>

  <div class="w-full max-w-sm rounded-2xl p-5 space-y-3" style="background:var(--bg-panel);">
    <div class="flex justify-between"><span class="text-white/50">مجموع نقاطك</span><span id="totalScore" class="font-black" style="color:var(--lime)">0</span></div>
    <div class="flex justify-between"><span class="text-white/50">ترتيبك الحالي</span><span id="currentRank" class="font-black" style="color:var(--teal)">-</span></div>
  </div>
</section>

<!-- ============ نهاية اللعبة ============ -->
<section id="screen-ended" class="screen relative z-10 min-h-screen flex-col items-center justify-center px-6 text-center">
  <div class="text-7xl mb-4">🏁</div>
  <h2 class="text-2xl font-black mb-4">انتهت اللعبة!</h2>
  <div class="w-full max-w-sm rounded-2xl p-6 space-y-3 mb-6" style="background:var(--bg-panel);">
    <div class="flex justify-between"><span class="text-white/50">نقاطك النهائية</span><span id="finalScore" class="font-black text-xl" style="color:var(--lime)">0</span></div>
    <div class="flex justify-between"><span class="text-white/50">ترتيبك النهائي</span><span id="finalRank" class="font-black text-xl" style="color:var(--amber)">-</span></div>
  </div>
  <a href="index.html" class="text-white/50 text-sm hover:text-white/80">العب لعبة تانية →</a>
</section>

<!-- ============ خطأ ============ -->
<section id="screen-error" class="screen relative z-10 min-h-screen flex-col items-center justify-center px-6 text-center">
  <p class="text-xl font-bold mb-3" style="color:var(--coral)">حصل مشكلة</p>
  <p id="errorText" class="text-white/50 mb-6">الغرفة اتقفلت أو مش موجودة</p>
  <a href="index.html" class="rounded-2xl py-3 px-8 font-bold" style="background:var(--amber); color:var(--bg-deep);">ارجع للصفحة الرئيسية</a>
</section>

<script type="module">
  import { db, ref, onValue, get, submitAnswer } from "./firebase-config.js";

  const roomCode = sessionStorage.getItem('roomCode');
  const playerId = sessionStorage.getItem('playerId');
  const playerName = sessionStorage.getItem('playerName');

  if (!roomCode || !playerId) {
    window.location.href = 'index.html';
  }

  document.getElementById('waitingName').textContent = playerName || '';

  const CHOICE_STYLES = [
    { color: 'var(--coral)', shape: '▲' },
    { color: 'var(--teal)',  shape: '●' },
    { color: 'var(--amber)', shape: '■' },
    { color: 'var(--lime)',  shape: '◆' },
  ];

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
  }

  let lastStatus = null;
  let lastQuestionIndex = null;
  let hasAnswered = false;
  let timerInterval = null;
  let currentQuestionStartTime = null;
  let currentTimeLimit = 20;

  const roomRef = ref(db, `rooms/${roomCode}`);
  onValue(roomRef, (snap) => {
    if (!snap.exists()) {
      document.getElementById('errorText').textContent = 'الغرفة اتقفلت أو مش موجودة';
      showScreen('screen-error');
      return;
    }
    const room = snap.val();

    if (room.status !== lastStatus || room.currentQuestionIndex !== lastQuestionIndex) {
      lastStatus = room.status;
      lastQuestionIndex = room.currentQuestionIndex;
      handleStatusChange(room);
    }
  });

  function handleStatusChange(room) {
    clearInterval(timerInterval);
    const index = room.currentQuestionIndex;

    if (room.status === 'waiting') {
      showScreen('screen-waiting');

    } else if (room.status === 'question') {
      hasAnswered = false;
      const q = room.questions[index];
      currentQuestionStartTime = room.questionStartTime;
      currentTimeLimit = q.timeLimit || 20;

      document.getElementById('qCounter').textContent = `سؤال ${index + 1}`;
      document.getElementById('questionText').textContent = q.text;

      const grid = document.getElementById('choicesGrid');
      grid.innerHTML = q.choices.map((c, i) => `
        <button data-index="${i}" class="choice-btn rounded-2xl p-4 flex flex-col items-center justify-center gap-2 font-bold text-base"
                style="background:${CHOICE_STYLES[i].color}; color:var(--bg-deep);">
          <span class="text-2xl">${CHOICE_STYLES[i].shape}</span>
          <span>${c}</span>
        </button>
      `).join('');

      grid.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => handleAnswerClick(btn, index));
      });

      showScreen('screen-question');
      runCountdown();

    } else if (room.status === 'reveal') {
      showReveal(room, index);

    } else if (room.status === 'ended') {
      showFinal(room);
    }
  }

  function runCountdown() {
    const timerEl = document.getElementById('timer');
    function tick() {
      const elapsed = (Date.now() - currentQuestionStartTime) / 1000;
      const remaining = Math.max(0, Math.ceil(currentTimeLimit - elapsed));
      timerEl.textContent = remaining;
      if (remaining <= 0) {
        clearInterval(timerInterval);
        if (!hasAnswered) {
          hasAnswered = true;
          showScreen('screen-submitted');
          document.querySelector('#screen-submitted p').textContent = 'خلص الوقت!';
        }
      }
    }
    tick();
    timerInterval = setInterval(tick, 300);
  }

  async function handleAnswerClick(btn, questionIndex) {
    if (hasAnswered) return;
    hasAnswered = true;
    clearInterval(timerInterval);

    const choiceIndex = Number(btn.dataset.index);
    const timeMs = Date.now() - currentQuestionStartTime;

    document.querySelectorAll('.choice-btn').forEach(b => {
      if (b !== btn) b.classList.add('dimmed');
      else b.classList.add('selected');
    });

    try {
      await submitAnswer(roomCode, questionIndex, playerId, choiceIndex, timeMs);
    } catch (e) { /* تجاهل، هيتعالج بحساب النقاط كإجابة غير موجودة */ }

    setTimeout(() => showScreen('screen-submitted'), 400);
  }

  async function showReveal(room, index) {
    const q = room.questions[index];
    const answersSnap = await get(ref(db, `rooms/${roomCode}/answers/${index}`));
    const answers = answersSnap.val() || {};
    const myAnswer = answers[playerId];
    const isCorrect = myAnswer && myAnswer.choiceIndex === q.correctIndex;

    let points = 0;
    if (isCorrect) {
      const speedBonus = Math.max(0, 1 - (myAnswer.timeMs / (q.timeLimit * 1000)));
      points = Math.round(500 + 500 * speedBonus);
    }

    document.getElementById('resultIcon').textContent = isCorrect ? '✅' : (myAnswer ? '❌' : '⌛');
    document.getElementById('resultText').textContent = isCorrect
      ? 'إجابة صحيحة!'
      : (myAnswer ? 'إجابة غلط' : 'محاولتش تجاوب');
    document.getElementById('pointsEarned').textContent = points > 0 ? `+${points} نقطة` : '';

    const players = room.players || {};
    const myScore = players[playerId]?.score || 0;
    document.getElementById('totalScore').textContent = myScore;

    const sorted = Object.entries(players).sort((a, b) => (b[1].score || 0) - (a[1].score || 0));
    const myRank = sorted.findIndex(([id]) => id === playerId) + 1;
    document.getElementById('currentRank').textContent = myRank > 0 ? `#${myRank} من ${sorted.length}` : '-';

    showScreen('screen-reveal');
  }

  function showFinal(room) {
    const players = room.players || {};
    const myScore = players[playerId]?.score || 0;
    const sorted = Object.entries(players).sort((a, b) => (b[1].score || 0) - (a[1].score || 0));
    const myRank = sorted.findIndex(([id]) => id === playerId) + 1;

    document.getElementById('finalScore').textContent = myScore;
    document.getElementById('finalRank').textContent = myRank > 0 ? `#${myRank} من ${sorted.length}` : '-';

    showScreen('screen-ended');
  }
</script>
</body>
</html>
