<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>تسجيل دخول المنصة | مستر إيهاب أشرف</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
    </script>

    <style>
        :root {
            --bg-start: #0f0c29;
            --bg-mid: #1a1a40;
            --bg-end: #0a0a1a;
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-shadow: rgba(0, 0, 0, 0.4);
            --accent-1: #a78bfa;
            --accent-2: #60a5fa;
            --accent-3: #34d399;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-focus-bg: rgba(255, 255, 255, 0.09);
            --btn-gradient: linear-gradient(135deg, #8b5cf6 0%, #6366f1 40%, #3b82f6 100%);
            --btn-glow: rgba(99, 102, 241, 0.5);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            height: 100%;
            margin: 0;
            padding: 0;
            background: #0a0a1a;
        }

        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            background: radial-gradient(ellipse at 30% 20%, #1e1b4b 0%, #0f0c29 45%, #0a0a1a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.6s ease;
            position: relative;
        }

        /* ── شبكة الخلفية ── */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.06;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.3) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 70%);
        }

        /* ── جسيمات عائمة ── */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: floatUp linear infinite;
            opacity: 0;
            will-change: transform, opacity;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0) rotate(0deg);
                opacity: 0;
            }
            5% {
                opacity: 0.7;
            }
            50% {
                opacity: 0.4;
            }
            85% {
                opacity: 0.1;
            }
            100% {
                transform: translateY(-120px) scale(1.4) rotate(360deg);
                opacity: 0;
            }
        }

        /* ── بقع ضوئية كبيرة ── */
        .light-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.35;
            animation: orbDrift 14s ease-in-out infinite;
        }
        .light-orb.orb-1 {
            width: 420px;
            height: 420px;
            background: #7c3aed;
            top: -10%;
            left: -8%;
            animation-delay: 0s;
        }
        .light-orb.orb-2 {
            width: 340px;
            height: 340px;
            background: #2563eb;
            bottom: -12%;
            right: -6%;
            animation-delay: -7s;
        }
        .light-orb.orb-3 {
            width: 280px;
            height: 280px;
            background: #10b981;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -4s;
            opacity: 0.2;
        }
        @keyframes orbDrift {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(40px, -30px) scale(1.15);
            }
            50% {
                transform: translate(-20px, 25px) scale(0.9);
            }
            75% {
                transform: translate(-35px, -15px) scale(1.08);
            }
        }

        /* ── شاشة المقدمة Splash ── */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.7s ease, transform 0.7s ease;
        }
        .splash-image {
            max-width: 75%;
            max-height: 55vh;
            object-fit: contain;
            opacity: 0;
            transform: scale(0.85);
            filter: drop-shadow(0 0 60px rgba(139, 92, 246, 0.5));
            border-radius: 24px;
            transition: filter 0.6s;
        }
        .splash-image:hover {
            filter: drop-shadow(0 0 90px rgba(139, 92, 246, 0.8));
        }
        .loader-track {
            width: 220px;
            height: 3px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            margin-top: 35px;
            overflow: hidden;
            position: relative;
            opacity: 0;
        }
        .loader-fill {
            position: absolute;
            left: -100%;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #8b5cf6, #6366f1, #3b82f6);
            box-shadow: 0 0 14px rgba(99, 102, 241, 0.7);
        }
        .splash-subtitle {
            color: #a5b4fc;
            font-size: 0.95rem;
            font-weight: 600;
            margin-top: 20px;
            letter-spacing: 2px;
            opacity: 0;
            font-family: 'El Messiri', sans-serif;
        }

        /* ── حاوية تسجيل الدخول ── */
        #login-container {
            display: none;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid var(--glass-border);
            border-radius: 36px;
            padding: 40px 30px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
            position: relative;
            overflow: hidden;
        }
        .glass-card::before {
            content: "";
            position: absolute;
            top: -40%;
            left: -40%;
            width: 180%;
            height: 180%;
            background: radial-gradient(circle at 30% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 60%),
                radial-gradient(circle at 70% 70%, rgba(59, 130, 246, 0.06) 0%, transparent 60%);
            pointer-events: none;
            animation: shimmer 8s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%,
            100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(3deg);
            }
        }

        /* ── الشعار ── */
        .logo-container {
            position: relative;
            width: 130px;
            height: 105px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .logo-shape {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #3b82f6 100%);
            border-radius: 28% 72% 65% 35% / 38% 28% 72% 62%;
            animation: morphLogo 7s ease-in-out infinite;
            box-shadow: 0 20px 45px rgba(99, 102, 241, 0.45);
        }
        .logo-shape::after {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: inherit;
            background: inherit;
            filter: blur(18px);
            opacity: 0.5;
            z-index: -1;
        }
        @keyframes morphLogo {
            0%,
            100% {
                border-radius: 28% 72% 65% 35% / 38% 28% 72% 62%;
            }
            25% {
                border-radius: 55% 45% 40% 60% / 50% 55% 45% 50%;
            }
            50% {
                border-radius: 70% 30% 55% 45% / 35% 60% 40% 65%;
            }
            75% {
                border-radius: 40% 60% 70% 30% / 60% 35% 65% 40%;
            }
        }
        .logo-text {
            position: relative;
            z-index: 10;
            color: #fff;
            font-family: 'El Messiri', sans-serif;
            font-size: 2.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.3);
            pointer-events: none;
        }
        .logo-ring {
            position: absolute;
            width: 115%;
            height: 115%;
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.2);
            animation: spinRing 20s linear infinite;
            pointer-events: none;
        }
        @keyframes spinRing {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── العناوين ── */
        .welcome-title {
            color: #f1f5f9;
            font-size: 1.7rem;
            font-weight: 800;
            margin-bottom: 4px;
            letter-spacing: 0;
            position: relative;
            z-index: 2;
        }
        .welcome-sub {
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 28px;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
        }

        /* ── الحقول ── */
        .input-group {
            position: relative;
            margin-bottom: 16px;
            z-index: 2;
        }
        .input-group i {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1rem;
            transition: color 0.3s;
            pointer-events: none;
        }
        .login-input {
            width: 100%;
            padding: 15px 48px 15px 18px;
            background: var(--input-bg);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            outline: none;
            transition: all 0.35s;
            text-align: right;
            font-weight: 600;
            font-size: 0.95rem;
            color: #e2e8f0;
            font-family: 'Cairo', sans-serif;
            letter-spacing: 0.3px;
        }
        .login-input::placeholder {
            color: #475569;
            font-weight: 500;
        }
        .login-input:focus {
            border-color: #818cf8;
            background: var(--input-focus-bg);
            box-shadow: 0 0 28px rgba(99, 102, 241, 0.25), 0 8px 20px rgba(0, 0, 0, 0.3);
            color: #fff;
        }
        .login-input:focus+i,
        .input-group:focus-within i {
            color: #a5b4fc;
        }
        .toggle-pass {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 8px;
            font-size: 0.9rem;
            transition: color 0.3s;
            z-index: 3;
        }
        .toggle-pass:hover {
            color: #a5b4fc;
        }

        /* ── الزر ── */
        .btn-login {
            width: 100%;
            padding: 15px;
            background: var(--btn-gradient);
            color: #fff;
            border: none;
            border-radius: 20px;
            font-weight: 800;
            font-size: 1.05rem;
            cursor: pointer;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
            transition: all 0.35s;
            box-shadow: 0 10px 30px var(--btn-glow);
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
        }
        .btn-login::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .btn-login:hover::before {
            opacity: 1;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 18px 40px rgba(99, 102, 241, 0.6);
        }
        .btn-login:active {
            transform: scale(0.96);
            transition: transform 0.15s;
        }

        /* ── التذييل ── */
        .footer-text {
            margin-top: 22px;
            position: relative;
            z-index: 2;
            color: #64748b;
            font-size: 0.72rem;
            font-weight: 600;
        }
        .footer-text a {
            color: #a5b4fc;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }
        .footer-text a:hover {
            color: #c7d2fe;
        }

        /* ── SweetAlert2 تخصيص ── */
        .swal2-popup {
            background: #1e1b4b !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 28px !important;
            color: #e2e8f0 !important;
            font-family: 'Cairo', sans-serif !important;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.7) !important;
        }
        .swal2-title {
            color: #f1f5f9 !important;
            font-weight: 800 !important;
        }
        .swal2-html-container {
            color: #cbd5e1 !important;
        }
        .swal2-confirm {
            background: var(--btn-gradient) !important;
            border-radius: 16px !important;
            font-weight: 700 !important;
            padding: 12px 28px !important;
            box-shadow: 0 8px 24px var(--btn-glow) !important;
        }

        /* ── تجاوب ── */
        @media (max-width: 480px) {
            .glass-card {
                padding: 30px 20px;
                border-radius: 30px;
            }
            .logo-container {
                width: 100px;
                height: 82px;
                margin-bottom: 14px;
            }
            .logo-text {
                font-size: 2rem;
            }
            .welcome-title {
                font-size: 1.4rem;
            }
            .login-input {
                padding: 14px 44px 14px 14px;
                font-size: 0.88rem;
                border-radius: 16px;
            }
            .btn-login {
                padding: 13px;
                font-size: 0.95rem;
                border-radius: 16px;
            }
        }
    </style>
</head>
<body id="main-body">

    <!-- بقع ضوئية -->
    <div class="light-orb orb-1"></div>
    <div class="light-orb orb-2"></div>
    <div class="light-orb orb-3"></div>

    <!-- شبكة الخلفية -->
    <div class="bg-grid"></div>

    <!-- جسيمات -->
    <div class="particles-container" id="particles-container"></div>

    <!-- ══════════ شاشة المقدمة Splash ══════════ -->
    <div id="splash-screen">
        <img src="1000071506.png" alt="Atlas Logo" class="splash-image" id="splash-img">
        <div class="loader-track" id="splash-loader-track">
            <div class="loader-fill" id="splash-loader-fill"></div>
        </div>
        <p class="splash-subtitle" id="splash-subtitle">إعداد وتصميم: أ. إيهاب أشرف</p>
    </div>

    <!-- ══════════ نموذج تسجيل الدخول ══════════ -->
    <div id="login-container">
        <div class="glass-card">
            <!-- شعار أطلس -->
            <div class="logo-container">
                <div class="logo-shape"></div>
                <div class="logo-ring"></div>
                <div class="logo-text">اطلس</div>
            </div>

            <h2 class="welcome-title">مرحباً بك يا بطل 🚀</h2>
            <p class="welcome-sub">يرجى تسجيل الدخول للبدء</p>

            <!-- اسم المستخدم -->
            <div class="input-group">
                <input type="text" id="user" class="login-input" placeholder="اسم المستخدم" autocomplete="off">
                <i class="fas fa-user"></i>
            </div>

            <!-- كلمة المرور -->
            <div class="input-group">
                <input type="password" id="pass" class="login-input" placeholder="كلمة المرور">
                <i class="fas fa-lock"></i>
                <button type="button" class="toggle-pass" id="toggle-pass-btn" aria-label="إظهار كلمة المرور">
                    <i class="fas fa-eye"></i>
                </button>
            </div>

            <!-- زر الدخول -->
            <button onclick="handleLogin()" class="btn-login">
                <i class="fas fa-sign-in-alt" style="margin-left: 8px;"></i> دخول المنصة
            </button>

            <!-- تذييل -->
            <div class="footer-text">
                <span>إعداد وتصميم: أ. إيهاب أشرف</span> •
                <a href="https://wa.me/201559116736" target="_blank" rel="noopener">
                    <i class="fab fa-whatsapp"></i> 01559116736
                </a>
            </div>
        </div>
    </div>

    <script>
        const SHEET_URL =
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5wBVZeNv3Ijg80p-YkD57IPnAXnzWFT1kyoIVXIn46zY-U9fcykFNd3vgAzjMkJlOk0J2hqazdIoI/pub?gid=0&single=true&output=csv";

        // ════════════════ توليد الجسيمات ════════════════
        (function createParticles() {
            const container = document.getElementById('particles-container');
            const colors = ['#a78bfa', '#818cf8', '#60a5fa', '#34d399', '#c4b5fd', '#93c5fd', '#6ee7b7',
            '#f0e6ff'];
            const count = 55;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 6 + 2;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const duration = Math.random() * 18 + 10;
                const delay = Math.random() * 20;
                const blur = Math.random() < 0.3 ? 'blur(1px)' : 'none';

                particle.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    background: ${color};
                    left: ${left}%;
                    animation-duration: ${duration}s;
                    animation-delay: ${delay}s;
                    filter: ${blur};
                    box-shadow: 0 0 ${size * 3}px ${color};
                `;
                container.appendChild(particle);
            }
        })();

        // ════════════════ Splash Screen Animation ════════════════
        window.onload = function() {
            sessionStorage.clear();
            localStorage.clear();

            const splashImg = document.getElementById('splash-img');
            const splashLoaderTrack = document.getElementById('splash-loader-track');
            const splashLoaderFill = document.getElementById('splash-loader-fill');
            const splashSubtitle = document.getElementById('splash-subtitle');

            // صورة المقدمة تظهر بتكبير ناعم
            anime({
                targets: splashImg,
                opacity: [0, 1],
                scale: [0.8, 1],
                easing: 'easeOutCubic',
                duration: 1400,
                complete: function() {
                    // إضافة وميض خفيف على الصورة بعد ظهورها
                    anime({
                        targets: splashImg,
                        filter: [
                            'drop-shadow(0 0 60px rgba(139,92,246,0.5))',
                            'drop-shadow(0 0 100px rgba(139,92,246,0.9))',
                            'drop-shadow(0 0 60px rgba(139,92,246,0.5))'
                        ],
                        easing: 'easeInOutSine',
                        duration: 1800,
                        loop: false
                    });
                }
            });

            // شريط التحميل يظهر
            anime({
                targets: splashLoaderTrack,
                opacity: [0, 1],
                easing: 'easeInQuad',
                duration: 800,
                delay: 600
            });

            // امتلاء شريط التحميل
            anime({
                targets: splashLoaderFill,
                left: ['-100%', '0%'],
                easing: 'easeInOutCubic',
                duration: 2600,
                delay: 900,
                update: function(anim) {
                    // عند اكتمال 70% تقريباً نظهر التذييل
                    if (anim.progress > 68 && splashSubtitle.style.opacity === '0') {
                        anime({
                            targets: splashSubtitle,
                            opacity: [0, 1],
                            translateY: [10, 0],
                            easing: 'easeOutQuad',
                            duration: 600
                        });
                        splashSubtitle.style.opacity = '1';
                    }
                },
                complete: function() {
                    // لحظة إضافية قبل الانتقال
                    setTimeout(() => showLoginForm(), 350);
                }
            });
        };

        function showLoginForm() {
            const splash = document.getElementById('splash-screen');
            const login = document.getElementById('login-container');

            // إخفاء شاشة المقدمة
            anime({
                targets: splash,
                opacity: [1, 0],
                scale: [1, 1.06],
                easing: 'easeInCubic',
                duration: 550,
                complete: function() {
                    splash.style.display = 'none';
                    document.body.style.overflow = 'auto';

                    // إظهار نموذج الدخول
                    login.style.display = 'block';
                    anime({
                        targets: login,
                        opacity: [0, 1],
                        translateY: [30, 0],
                        easing: 'easeOutCubic',
                        duration: 750
                    });

                    // إظهار الجسيمات بشكل أوضح
                    anime({
                        targets: '.particle',
                        opacity: function() {
                            return anime.random(0.25, 0.7);
                        },
                        easing: 'easeOutQuad',
                        duration: 2000,
                        delay: anime.stagger(30)
                    });
                }
            });
        }

        // ════════════════ إظهار/إخفاء كلمة المرور ════════════════
        const togglePassBtn = document.getElementById('toggle-pass-btn');
        const passInput = document.getElementById('pass');
        togglePassBtn.addEventListener('click', function() {
            const icon = this.querySelector('i');
            if (passInput.type === 'password') {
                passInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
                this.style.color = '#a5b4fc';
            } else {
                passInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
                this.style.color = '#64748b';
            }
        });

        // ═══════════════ـ تأثير ضغط الزر ════════════════
        document.querySelector('.btn-login').addEventListener('mousedown', function() {
            anime({
                targets: this,
                scale: [1, 0.94],
                easing: 'easeOutQuad',
                duration: 150
            });
        });
        document.querySelector('.btn-login').addEventListener('mouseup', function() {
            anime({
                targets: this,
                scale: [0.94, 1],
                easing: 'easeOutBack',
                duration: 350
            });
        });
        document.querySelector('.btn-login').addEventListener('mouseleave', function() {
            anime({
                targets: this,
                scale: [0.94, 1],
                easing: 'easeOutBack',
                duration: 350
            });
        });

        // ════════════════ معالجة تسجيل الدخول ════════════════
        async function handleLogin() {
            const uInput = document.getElementById('user').value.toLowerCase().trim();
            const pInput = document.getElementById('pass').value.toLowerCase().trim();

            if (!uInput || !pInput) {
                Swal.fire({
                    icon: 'warning',
                    title: 'تنبيه',
                    text: 'برجاء كتابة اسم المستخدم وكلمة المرور',
                    confirmButtonText: 'حسناً'
                });
                // اهتزاز الحقول الفارغة
                anime({
                    targets: '.login-input',
                    translateX: [0, -8, 8, -5, 5, -2, 2, 0],
                    easing: 'easeInOutSine',
                    duration: 500
                });
                return;
            }

            Swal.fire({
                title: 'جاري التحقق...',
                allowOutsideClick: false,
                didOpen: () => {
                    Swal.showLoading();
                }
            });

            try {
                const response = await fetch(`${SHEET_URL}&t=${new Date().getTime()}`);
                if (!response.ok) throw new Error('فشل الاتصال');
                const csvData = await response.text();
                const rows = csvData.split("\n").map(row => row.split(","));

                let found = false;
                let userRole = "student";

                for (let i = 1; i < rows.length; i++) {
                    const user = rows[i][0]?.trim().toLowerCase();
                    const pass = rows[i][1]?.trim().toLowerCase();
                    if (user === uInput && pass === pInput) {
                        found = true;
                        if (user === "mrehab") userRole = "admin";
                        break;
                    }
                }

                if (found) {
                    sessionStorage.setItem("atlas_auth", "true");
                    sessionStorage.setItem("role", userRole);
                    Swal.fire({
                        icon: 'success',
                        title: 'تم الدخول بنجاح! 🎉',
                        text: 'يتم توجيهك الآن...',
                        showConfirmButton: false,
                        timer: 1600,
                        timerProgressBar: true
                    });
                    setTimeout(() => {
                        window.location.href = (userRole === "admin") ? "dashboard.html" : "home.html";
                    }, 1600);
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'عذراً!',
                        text: 'اسم المستخدم أو كلمة المرور غير صحيحة',
                        confirmButtonText: 'المحاولة مرة أخرى'
                    });
                    // اهتزاز الحقول
                    anime({
                        targets: '.login-input',
                        translateX: [0, -10, 10, -6, 6, -3, 3, 0],
                        easing: 'easeInOutSine',
                        duration: 550
                    });
                }
            } catch (error) {
                Swal.fire({
                    icon: 'error',
                    title: 'خطأ في الاتصال',
                    text: 'تعذر الوصول إلى قاعدة البيانات. حاول لاحقاً.',
                    confirmButtonText: 'حسناً'
                });
                console.error(error);
            }
        }

        // ════════════════ دعم زر Enter ════════════════
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const loginContainer = document.getElementById('login-container');
                if (loginContainer.style.display === 'block' && loginContainer.style.opacity === '1') {
                    handleLogin();
                }
            }
        });
    </script>
</body>
</html>
