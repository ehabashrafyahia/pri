<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>تسجيل دخول المنصة | مستر إيهاب أشرف</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=El+Messiri:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js">
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11">
    </script>

    <style>
        :root {
            --bg-deep: #06060f;
            --accent-1: #a78bfa;
            --accent-2: #6366f1;
            --accent-3: #34d399;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            height: 100%;
            margin: 0;
            padding: 0;
            background: var(--bg-deep);
        }

        body {
            font-family: 'Cairo', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100%;
            min-height: 100dvh;
            overflow: hidden;
            background: radial-gradient(ellipse at 30% 20%, #1a1535 0%, #0c0a1a 45%, #050510 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* شبكة خلفية */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0.03;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.3) 1px, transparent 1px);
            background-size: 50px 50px;
            mask-image: radial-gradient(ellipse at center, black 25%, transparent 70%);
        }

        /* بقع ضوئية */
        .light-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.28;
            animation: orbDrift 16s ease-in-out infinite;
        }
        .orb-1 {
            width: 450px;
            height: 450px;
            background: #7c3aed;
            top: -12%;
            left: -10%;
        }
        .orb-2 {
            width: 350px;
            height: 350px;
            background: #2563eb;
            bottom: -14%;
            right: -8%;
            animation-delay: -8s;
        }
        .orb-3 {
            width: 280px;
            height: 280px;
            background: #10b981;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -5s;
            opacity: 0.14;
        }
        @keyframes orbDrift {
            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }
            25% {
                transform: translate(40px, -30px) scale(1.14);
            }
            50% {
                transform: translate(-20px, 25px) scale(0.88);
            }
            75% {
                transform: translate(-35px, -15px) scale(1.06);
            }
        }

        /* ════════════════ شاشة الترحيب الجديدة ════════════════ */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, #0f0c24 0%, #050510 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.7s ease, transform 0.7s ease;
        }

        /* الدوائر المتحركة خلف الشعار */
        .splash-rings {
            position: absolute;
            width: 280px;
            height: 280px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }
        .splash-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(139, 92, 246, 0.2);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: ringPulse 3s ease-in-out infinite;
        }
        .splash-ring:nth-child(1) {
            width: 100%;
            height: 100%;
            animation-delay: 0s;
        }
        .splash-ring:nth-child(2) {
            width: 80%;
            height: 80%;
            animation-delay: 0.5s;
        }
        .splash-ring:nth-child(3) {
            width: 60%;
            height: 60%;
            animation-delay: 1s;
        }
        @keyframes ringPulse {
            0%,
            100% {
                opacity: 0.2;
                transform: translate(-50%, -50%) scale(1);
            }
            50% {
                opacity: 0.5;
                transform: translate(-50%, -50%) scale(1.15);
            }
        }

        /* الشعار الرئيسي */
        .splash-logo-container {
            position: relative;
            width: 140px;
            height: 140px;
            margin-bottom: 30px;
            z-index: 2;
        }
        .splash-logo-shape {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #3b82f6 100%);
            border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            animation: morphSplash 5s ease-in-out infinite;
            box-shadow: 0 0 80px rgba(99, 102, 241, 0.7), 0 0 120px rgba(139, 92, 246, 0.4);
        }
        .splash-logo-shape::after {
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: inherit;
            background: inherit;
            filter: blur(25px);
            opacity: 0.5;
            z-index: -1;
            animation: morphSplash 5s ease-in-out infinite;
        }
        @keyframes morphSplash {
            0%,
            100% {
                border-radius: 30% 70% 70% 30% / 30% 30% 70% 70%;
            }
            33% {
                border-radius: 55% 45% 40% 60% / 50% 55% 45% 50%;
            }
            66% {
                border-radius: 70% 30% 55% 45% / 35% 60% 40% 65%;
            }
        }
        .splash-logo-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-family: 'El Messiri', sans-serif;
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.6);
            z-index: 3;
            pointer-events: none;
        }

        /* خطوط متقاطعة حول الشعار */
        .splash-crosshair {
            position: absolute;
            width: 180px;
            height: 180px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 1;
            opacity: 0.5;
        }
        .splash-crosshair::before,
        .splash-crosshair::after {
            content: "";
            position: absolute;
            background: rgba(167, 139, 250, 0.4);
        }
        .splash-crosshair::before {
            width: 2px;
            height: 100%;
            left: 50%;
            transform: translateX(-50%);
            animation: crossPulse 2.5s ease-in-out infinite;
        }
        .splash-crosshair::after {
            height: 2px;
            width: 100%;
            top: 50%;
            transform: translateY(-50%);
            animation: crossPulse 2.5s ease-in-out infinite 0.3s;
        }
        @keyframes crossPulse {
            0%,
            100% {
                opacity: 0.3;
                transform: translateX(-50%) scaleY(1);
            }
            50% {
                opacity: 0.8;
                transform: translateX(-50%) scaleY(1.4);
            }
        }

        /* عنوان أطلس */
        .splash-title {
            color: #fff;
            font-family: 'El Messiri', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 4px;
            margin-bottom: 8px;
            z-index: 2;
            text-shadow: 0 0 40px rgba(139, 92, 246, 0.7);
            opacity: 0;
        }

        /* شريط التحميل */
        .splash-loader-wrapper {
            width: 240px;
            height: 2px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            margin-top: 25px;
            overflow: hidden;
            position: relative;
            z-index: 2;
            opacity: 0;
        }
        .splash-loader-fill {
            position: absolute;
            left: -100%;
            width: 100%;
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #8b5cf6, #6366f1, #3b82f6);
            box-shadow: 0 0 18px rgba(99, 102, 241, 0.8);
        }

        /* نص التحميل */
        .splash-loading-text {
            color: #a5b4fc;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 3px;
            margin-top: 16px;
            z-index: 2;
            opacity: 0;
        }

        /* جسيمات الشاشة الترحيبية */
        .splash-particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 1;
        }
        .splash-particle {
            position: absolute;
            border-radius: 50%;
            animation: splashFloat 4s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes splashFloat {
            0%,
            100% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
            25% {
                opacity: 0.7;
            }
            50% {
                transform: translateY(-30px) translateX(15px) scale(1.4);
                opacity: 0.3;
            }
            75% {
                opacity: 0.7;
            }
            100% {
                transform: translateY(0) translateX(0) scale(1);
                opacity: 0;
            }
        }

        /* ════════════════ صفحة تسجيل الدخول ════════════════ */
        #login-container {
            display: none;
            opacity: 0;
            transform: translateY(30px);
            transition: all 0.8s cubic-bezier(0.22, 0.61, 0.36, 1);
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 420px;
            padding: 0 20px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(45px);
            -webkit-backdrop-filter: blur(45px);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 36px;
            padding: 40px 30px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            position: relative;
            overflow: hidden;
            text-align: center;
        }
        .glass-card::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 25% 20%, rgba(139, 92, 246, 0.12) 0%, transparent 55%),
                radial-gradient(circle at 75% 75%, rgba(59, 130, 246, 0.08) 0%, transparent 55%);
            pointer-events: none;
            animation: shimmer 10s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%,
            100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(4deg);
            }
        }

        .logo-container {
            position: relative;
            width: 120px;
            height: 98px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        .logo-shape {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #3b82f6 100%);
            border-radius: 28% 72% 65% 35% / 38% 28% 72% 62%;
            animation: morphLogo 7s ease-in-out infinite;
            box-shadow: 0 20px 45px rgba(99, 102, 241, 0.5);
        }
        .logo-shape::after {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: inherit;
            background: inherit;
            filter: blur(20px);
            opacity: 0.4;
            z-index: -1;
        }
        @keyframes morphLogo {
            0%,
            100% {
                border-radius: 28% 72% 65% 35% / 38% 28% 72% 62%;
            }
            25% {
                border-radius: 55% 45% 40% 60% / 50% 55% 45% 50%;
            }
            50% {
                border-radius: 70% 30% 55% 45% / 35% 60% 40% 65%;
            }
            75% {
                border-radius: 40% 60% 70% 30% / 60% 35% 65% 40%;
            }
        }
        .logo-text {
            position: relative;
            z-index: 10;
            color: #fff;
            font-family: 'El Messiri', sans-serif;
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.4);
        }
        .logo-ring {
            position: absolute;
            width: 115%;
            height: 115%;
            border-radius: 50%;
            border: 2px dashed rgba(255, 255, 255, 0.25);
            animation: spinRing 20s linear infinite;
            pointer-events: none;
        }
        @keyframes spinRing {
            to {
                transform: rotate(360deg);
            }
        }

        .welcome-title {
            color: #ffffff;
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
            position: relative;
            z-index: 2;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 100%;
        }
        .welcome-sub {
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 2;
            text-align: center;
            width: 100%;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
            z-index: 2;
            text-align: right;
        }
        .input-group i.fa-user,
        .input-group i.fa-lock {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1rem;
            transition: color 0.3s;
            pointer-events: none;
        }
        .login-input {
            width: 100%;
            padding: 14px 48px 14px 18px;
            background: rgba(255, 255, 255, 0.09);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            border-radius: 18px;
            outline: none;
            transition: all 0.3s;
            text-align: right;
            font-weight: 600;
            font-size: 0.95rem;
            color: #f1f5f9;
            font-family: 'Cairo', sans-serif;
            letter-spacing: 0.3px;
        }
        .login-input::placeholder {
            color: #64748b;
            font-weight: 500;
        }
        .login-input:focus {
            border-color: #a5b4fc;
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 25px rgba(129, 140, 248, 0.35), 0 8px 18px rgba(0, 0, 0, 0.3);
            color: #ffffff;
        }
        .input-group:focus-within i.fa-user,
        .input-group:focus-within i.fa-lock {
            color: #c7d2fe;
        }
        .toggle-pass {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 6px;
            font-size: 0.9rem;
            transition: color 0.3s;
            z-index: 3;
        }
        .toggle-pass:hover {
            color: #c7d2fe;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 40%, #3b82f6 100%);
            color: #fff;
            border: none;
            border-radius: 18px;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            letter-spacing: 1px;
            position: relative;
            z-index: 2;
            transition: all 0.35s;
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.55);
            font-family: 'Cairo', sans-serif;
            overflow: hidden;
            margin-top: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-login::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 60%);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .btn-login:hover::before {
            opacity: 1;
        }
        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 45px rgba(99, 102, 241, 0.7);
        }
        .btn-login:active {
            transform: scale(0.96);
            transition: transform 0.15s;
        }

        .footer-text {
            margin-top: 24px;
            position: relative;
            z-index: 2;
            color: #94a3b8;
            font-size: 0.72rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .footer-text a {
            color: #a5b4fc;
            text-decoration: none;
            font-weight: 700;
            transition: color 0.3s;
        }
        .footer-text a:hover {
            color: #c7d2fe;
        }

        .swal2-popup {
            background: #1e1b4b !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 28px !important;
            color: #e2e8f0 !important;
            font-family: 'Cairo', sans-serif !important;
        }
        .swal2-title {
            color: #f8fafc !important;
            font-weight: 800 !important;
        }
        .swal2-confirm {
            background: linear-gradient(135deg, #8b5cf6, #6366f1, #3b82f6) !important;
            border-radius: 16px !important;
            font-weight: 700 !important;
            padding: 12px 28px !important;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.5) !important;
        }

        @media (max-width: 480px) {
            .glass-card {
                padding: 30px 20px;
                border-radius: 30px;
            }
            .logo-container {
                width: 100px;
                height: 82px;
                margin-bottom: 20px;
            }
            .logo-text {
                font-size: 2rem;
            }
            .welcome-title {
                font-size: 1.5rem;
            }
            .login-input {
                padding: 13px 44px 13px 14px;
                font-size: 0.9rem;
                border-radius: 16px;
            }
            .btn-login {
                padding: 13px;
                border-radius: 16px;
            }
            .splash-logo-container {
                width: 110px;
                height: 110px;
            }
            .splash-logo-text {
                font-size: 2.4rem;
            }
            .splash-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body id="main-body">

    <div class="light-orb orb-2"></div>
    <div class="light-orb orb-3"></div>
    <div class="bg-grid"></div>

    <div id="splash-screen">
        <!-- جسيمات عائمة -->

        <!-- دوائر متحركة -->
        <div class="splash-rings">

    </div>

    <script>
        const SHEET_URL =
            "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ5wBVZeNv3Ijg80p-YkD57IPnAXnzWFT1kyoIVXIn46zY-U9fcykFNd3vgAzjMkJlOk0J2hqazdIoI/pub?gid=0&single=true&output=csv";

        // ════════════════ توليد جسيمات الشاشة الترحيبية ════════════════
        (function createSplashParticles() {
            const container = document.getElementById('splash-particles');
            const colors = ['#a78bfa', '#818cf8', '#60a5fa', '#34d399', '#c4b5fd', '#93c5fd', '#6ee7b7', '#f0e6ff'];
            const count = 40;
            for (let i = 0; i < count; i++) {
                const particle = document.createElement('div');
                particle.classList.add('splash-particle');
                const size = Math.random() * 4 + 1.5;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                const duration = Math.random() * 4 + 3;
                const delay = Math.random() * 5;
                particle.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    background: ${color};
                    left: ${left}%;
                    top: ${top}%;
                    animation-duration: ${duration}s;
                    animation-delay: ${delay}s;
                    box-shadow: 0 0 ${size * 4}px ${color};
                `;
                container.appendChild(particle);
            }
        })();

        // ════════════════ أنيميشن شاشة الترحيب ════════════════
        window.onload = function() {
            sessionStorage.clear();
            localStorage.clear();

            const splashLogo = document.getElementById('splash-logo');
            const splashTitle = document.getElementById('splash-title');
            const splashLoaderWrapper = document.getElementById('splash-loader-wrapper');
            const splashLoaderFill = document.getElementById('splash-loader-fill');
            const splashLoadingText = document.getElementById('splash-loading-text');

            // تسلسل ظهور العناصر
            const timeline = anime.timeline({
                easing: 'easeOutExpo',
            });

            // 1. ظهور الشعار مع تأثير نبض
            timeline
                .add({
                    targets: splashLogo,
                    scale: [0, 1],
                    opacity: [0, 1],
                    duration: 1000,
                    easing: 'easeOutElastic(1, .6)',
                })
                // 2. ظهور العنوان
                .add({
                    targets: splashTitle,
                    opacity: [0, 1],
                    translateY: [20, 0],
                    duration: 700,
                    easing: 'easeOutCubic',
                }, '-=400')
                // 3. ظهور شريط التحميل
                .add({
                    targets: splashLoaderWrapper,
                    opacity: [0, 1],
                    duration: 500,
                    easing: 'easeInQuad',
                }, '-=200')
                // 4. ظهور نص التحميل
                .add({
                    targets: splashLoadingText,
                    opacity: [0, 1],
                    duration: 500,
                    easing: 'easeInQuad',
                }, '-=300');

            // نبض مستمر للشعار
            anime({
                targets: '#splash-logo',
                scale: [1, 1.04, 1],
                easing: 'easeInOutSine',
                duration: 2500,
                loop: true,
                delay: 1200,
            });

            // نبض للعنوان
            anime({
                targets: '#splash-title',
                textShadow: [
                    '0 0 40px rgba(139,92,246,0.7)',
                    '0 0 70px rgba(139,92,246,1)',
                    '0 0 40px rgba(139,92,246,0.7)'
                ],
                easing: 'easeInOutSine',
                duration: 2200,
                loop: true,
                delay: 1400,
            });

            // امتلاء شريط التحميل
            anime({
                targets: splashLoaderFill,
                left: ['-100%', '0%'],
                easing: 'easeInOutCubic',
                duration: 2800,
                delay: 1600,
                update: function(anim) {
                    // تغيير نص التحميل عند التقدم
                    if (anim.progress > 80 && splashLoadingText.textContent !== 'اكتمل التحميل') {
                        splashLoadingText.textContent = 'اكتمل التحميل';
                        anime({
                            targets: splashLoadingText,
                            color: ['#a5b4fc', '#34d399', '#a5b4fc'],
                            easing: 'easeInOutSine',
                            duration: 1500,
                        });
                    }
                },
                complete: function() {
                    // وميض أخير قبل الانتقال
                    anime({
                        targets: '#splash-screen',
                        backgroundColor: [
                            'radial-gradient(ellipse at center, #0f0c24 0%, #050510 100%)',
                            'radial-gradient(ellipse at center, #1a1040 0%, #08061a 100%)',
                            'radial-gradient(ellipse at center, #0f0c24 0%, #050510 100%)'
                        ],
                        easing: 'easeInOutQuad',
                        duration: 400,
                        complete: function() {
                            setTimeout(() => showLoginForm(), 150);
                        }
                    });
                }
            });
        };

        function showLoginForm() {
            const splash = document.getElementById('splash-screen');
            const login = document.getElementById('login-container');

            // إخفاء شاشة الترحيب
            anime({
                targets: splash,
                opacity: [1, 0],
                scale: [1, 1.08],
                easing: 'easeInCubic',
                duration: 600,
                complete: function() {
                    splash.style.display = 'none';
                    document.body.style.overflow = 'auto';

                    // إظهار نموذج الدخول
                    login.style.display = 'block';
                    anime({
                        targets: login,
                        opacity: [0, 1],
                        translateY: [30, 0],
                        easing: 'easeOutCubic',
                        duration: 750,
                    });
                }
            });
        }

        // ════════════════ وظائف تسجيل الدخول ════════════════
        document.getElementById('toggle-pass-btn').addEventListener('click', function() {
            const pass = document.getElementById('pass');
            const icon = this.querySelector('i');
            if (pass.type === 'password') {
                pass.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
                this.style.color = '#c7d2fe';
            } else {
                pass.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
                this.style.color = '#94a3b8';
            }
        });

        const btn = document.querySelector('.btn-login');
        btn.addEventListener('mousedown', () => anime({ targets: btn, scale: [1, 0.94], duration: 150 }));
        btn.addEventListener('mouseup', () => anime({ targets: btn, scale: [0.94, 1], duration: 350,
            easing: 'easeOutBack' }));
        btn.addEventListener('mouseleave', () => anime({ targets: btn, scale: [0.94, 1], duration: 350,
            easing: 'easeOutBack' }));

        document.addEventListener('keydown', e => {
            if (e.key === 'Enter' && document.getElementById('login-container').style.display === 'block')
                handleLogin();
        });

        async function handleLogin() {
            const u = document.getElementById('user').value.trim().toLowerCase();
            const p = document.getElementById('pass').value.trim().toLowerCase();
            if (!u || !p) {
                Swal.fire({ icon: 'warning', title: 'تنبيه', text: 'برجاء كتابة اسم المستخدم وكلمة المرور',
                    confirmButtonText: 'حسناً' });
                anime({ targets: '.login-input', translateX: [0, -8, 8, -5, 5, -2, 2, 0], duration: 500,
                    easing: 'easeInOutSine' });
                return;
            }
            Swal.fire({ title: 'جاري التحقق...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });
            try {
                const res = await fetch(`${SHEET_URL}&t=${Date.now()}`);
                if (!res.ok) throw new Error('فشل الاتصال');
                const csv = await res.text();
                const rows = csv.split('\n').map(r => r.split(','));
                let found = false,
                    role = 'student';
                for (let i = 1; i < rows.length; i++) {
                    if (rows[i][0]?.trim().toLowerCase() === u && rows[i][1]?.trim().toLowerCase() === p) {
                        found = true;
                        if (u === 'mrehab') role = 'admin';
                        break;
                    }
                }
                if (found) {
                    sessionStorage.setItem('atlas_auth', 'true');
                    sessionStorage.setItem('role', role);
                    Swal.fire({ icon: 'success', title: 'تم الدخول بنجاح! 🎉', text: 'يتم توجيهك الآن...',
                        showConfirmButton: false, timer: 1600, timerProgressBar: true });
                    setTimeout(() => location.href = (role === 'admin' ? 'dashboard.html' : 'home.html'), 1600);
                } else {
                    Swal.fire({ icon: 'error', title: 'عذراً!', text: 'اسم المستخدم أو كلمة المرور غير صحيحة',
                        confirmButtonText: 'المحاولة مرة أخرى' });
                    anime({ targets: '.login-input', translateX: [0, -10, 10, -6, 6, -3, 3, 0], duration: 550,
                        easing: 'easeInOutSine' });
                }
            } catch (e) {
                Swal.fire({ icon: 'error', title: 'خطأ اتصال', text: 'تعذر الوصول إلى قاعدة البيانات. حاول لاحقاً.',
                    confirmButtonText: 'حسناً' });
            }
        }
    </script>
</body>
</html>
